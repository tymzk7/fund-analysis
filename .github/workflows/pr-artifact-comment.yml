name: Comment PR artifact link

on:
  workflow_run:
    workflows: ["Validate pull requests"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write
  issues: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Update artifact comment
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          pr_number="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.pull_requests[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            echo "No associated pull request; skipping."
            exit 0
          fi
          marker="<!-- fund-analysis-pr-artifact -->"
          artifact_url="$RUN_URL#artifacts"
          body="$(printf '%s\n**Analysis review**: %s\n\n[Download HTML report and PNG chart (Actions Artifact)](%s)\n\nArtifacts expire after 14 days. GitHub sign-in may be required.' "$marker" "$RUN_CONCLUSION" "$artifact_url")"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr_number/comments?per_page=100" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- fund-analysis-pr-artifact -->"))) | .id' | head -n 1)"
          if [[ -n "$existing" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$pr_number/comments" -f body="$body" >/dev/null
          fi
