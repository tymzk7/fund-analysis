name: Build and deploy analysis dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r analysis/requirements.txt

      - name: Run public-market analysis
        env:
          MPLBACKEND: Agg
        run: |
          python analysis/main.py \
            --source yahoo \
            --asset ACWI \
            --asset ^GSPC \
            --period 10y \
            --output-dir analysis/outputs \
            --save-png \
            --save-html \
            --no-show

      - name: Build Pages artifact
        run: |
          mkdir -p site
          cp analysis/outputs/analysis_report.html site/index.html
          cp analysis/outputs/analysis_chart.png site/analysis_chart.png
          touch site/.nojekyll
          find site -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
