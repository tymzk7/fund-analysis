name: Validate pull requests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r analysis/requirements.txt
      - name: Validate Python syntax
        run: python -m compileall -q analysis
      - name: Generate review report and chart
        env:
          MPLBACKEND: Agg
        run: |
          python analysis/main.py --source csv --asset analysis/data/sample.csv --output-dir analysis/outputs/pr-review --save-png --save-html --no-show
          test -s analysis/outputs/pr-review/analysis_chart.png
          test -s analysis/outputs/pr-review/analysis_report.html
      - name: Upload review artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-review-${{ github.event.pull_request.number || github.run_id }}
          path: |
            analysis/outputs/pr-review/analysis_report.html
            analysis/outputs/pr-review/analysis_chart.png
          retention-days: 14
          if-no-files-found: error
